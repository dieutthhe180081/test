server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: spring-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: spring-app
          __path__: /logs/app.log

    pipeline_stages:
      # 3. Parse MDC từ log
      - regex:
          expression: 'traceId=(?P<traceId>\S+) userId=(?P<userId>\S+) role=(?P<role>\S+)'

      # 4. Đẩy thành label để query nhanh
      - labels:
          traceId:
          userId:
          role: